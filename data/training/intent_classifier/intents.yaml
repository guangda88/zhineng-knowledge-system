intents:
  practice_method:
    keywords: ["怎么做", "如何练习", "动作要领", "步骤", "方法", "练法", "功法"]
    templates: ["{title}怎么做", "如何练习{title}", "{title}的动作要领是什么", "{title}的练习步骤", "{title}练法", "请讲解{title}的方法", "{title}应该怎么练", "我想学{title}，该怎么开始", "{title}有什么练习技巧", "练习{title}需要注意什么", "{title}的标准动作是什么", "怎样正确练习{title}"]
  scientific_basis:
    keywords: ["科学依据", "研究", "证明", "实验", "数据", "论文", "现代医学"]
    templates: ["{title}有科学依据吗", "关于{title}有什么研究", "{title}的现代科学研究", "有没有实验证明{title}的效果", "{title}的科学原理是什么", "{title}有论文支持吗", "学术界怎么看{title}", "{title}有什么数据支撑", "能否从科学角度解释{title}", "{title}有没有做过临床试验", "现代医学如何看{title}"]
  theory_explanation:
    keywords: ["什么是", "原理", "为什么", "解释", "含义", "概念", "理论"]
    templates: ["什么是{title}", "{title}的原理是什么", "为什么要有{title}", "请解释{title}的含义", "{title}是什么概念", "介绍一下{title}的理论", "{title}是什么意思", "能否通俗地解释{title}", "{title}的定义是什么", "{title}包含哪些内容", "为什么{title}很重要", "请详细说明{title}"]
  book_search:
    keywords: ["哪本书", "出处", "参考", "来源", "章节", "文献", "典籍"]
    templates: ["{title}出自哪本书", "{title}的出处是什么", "哪本书提到过{title}", "{title}的参考文献", "关于{title}的典籍有哪些", "{title}最早记载在哪里", "有没有古籍提到{title}", "{title}的原始文献是什么", "在哪里可以找到{title}的资料", "{title}出自哪个朝代的文献", "查阅{title}应该看什么书"]
  comparison:
    keywords: ["区别", "不同", "对比", "差异", "关系", "联系", "比较"]
    templates: ["{title}和{other}有什么区别", "对比{title}和{other}", "{title}与{other}的差异", "{title}和{other}的关系", "比较{title}和{other}的不同", "{title}和{other}哪个更好", "{title}跟{other}有什么联系", "{title}和{other}各自的优缺点", "{title}能不能代替{other}", "{title}与{other}有什么相同点"]