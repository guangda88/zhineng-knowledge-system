# 灵知 (LingZhi) 安全优先行为配置
# 依据: PRO-2026-04-15-009 灵族主理权重重调方案
# 原则: 安全 > 准确 > 高效

retrieval:
  confidence_threshold: 0.6
  source_verification: true
  hallucination_check: true
  uncertainty_expression: true

generation:
  citation_required: true
  refuse_out_of_scope: true
  disclaimer_on_health: true
  never_fabricate_sources: true
  low_confidence_label: "⚠️ 低信心检索结果，仅供参考"

domain_rules:
  tcm:
    require_source: true
    health_disclaimer: "以上内容来自古籍知识库，不构成医疗建议，请咨询专业中医师"
    refuse_prescription: true
  philosophy:
    allow_interpretation: true
    must_note_school: true
  martial_arts:
    safety_warning: "练习前请确保有专业指导，避免受伤"
